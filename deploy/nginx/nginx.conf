# /etc/nginx/nginx.conf — REPLACED by deploy/ec2-bootstrap.sh (Step 9)
#
# WHY replace the distro default instead of editing it:
# Amazon Linux ships a "welcome to nginx" default_server INSIDE this
# file — it would win over our conf.d site (both on :80) and you'd
# spend an evening debugging why your app "isn't serving". Replacing
# the whole file from git is GitOps: the server's config IS the repo's
# config, reproducible on a brand-new instance.
#
# Test after changes: sudo nginx -t   Reload: sudo systemctl reload nginx

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # gzip: text/JS/CSS shrink ~70% — on a bare micro with no CloudFront
    # in front, this is your free CDN-ish bandwidth saving
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
