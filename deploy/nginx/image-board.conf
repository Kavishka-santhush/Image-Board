# /etc/nginx/conf.d/image-board.conf — the ONE web entrypoint
#
# THE THREE-ROOM MENTAL MODEL (the lesson this file teaches):
#   /assets/...  → Nginx serves hashed JS/CSS straight from disk (fast, cache forever)
#   /api/...     → Nginx PROXIES to Node on 127.0.0.1:4000 (dynamic)
#   everything else → index.html (the SPA decides the route)
# This one file replaces the dev-time Vite proxy from Step 3 — the
# relative-URL trick means the React code never changed for this.

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/image-board;
    index index.html;

    # ---- static assets: Vite fingerprints every filename ----
    # app-a1b2c3.js changes name when code changes → cache 1 year,
    # "immutable" (browser never even revalidates). Fresh deploy =
    # new hash = new URL = automatic cache bust. THE correct way to
    # version static files — watch it work in the Network tab.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- index.html must NEVER be cached ----
    # if it were, users would keep loading the OLD asset hashes after
    # a deploy — the classic "stale SPA" bug
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- the SPA fallback (Step 3's promised prod fix) ----
    # refresh on /posts/3: no FILE matches → serve index.html → React
    # router takes over. Without this line: Nginx 404, "works in dev,
    # breaks in prod". $uri/ covers /some/dir/ style paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API proxy: Nginx is the reverse proxy, Node stays private ----
    # 4000 binds to localhost conceptually (no SG port for it!) — only
    # Nginx reaches it. proxy_pass WITHOUT a trailing path keeps the
    # full URI (/api/health arrives as /api/health — Express mounts /api).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # NOTE: no client_max_body_size bump — the biggest thing through
    # here is presign JSON (bytes). File uploads go browser→S3 directly
    # (Step 7), which is EXACTLY why this micro box can be tiny.
}
